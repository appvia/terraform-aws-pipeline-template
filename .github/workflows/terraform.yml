---
name: Terraform
on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "Makefile"
      - "README.md"
      - "scripts/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "Makefile"
      - "README.md"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-plan-and-apply-aws.yml@f2a5b0a646a988f5a0e80df7447aede6c07bbb44 # main
    name: Terraform Plan and Apply
    secrets:
      actions-id: "${{ secrets.ACTION_ID }}"
      actions-secret: "${{ secrets.ACTION_SECRET }}"
      infracost-api-key: ${{ secrets.ORG_INFRACOST_API_KEY }}
    with:
      ## Copies any additional directories into the apply stage
      # additional-dir: builds
      ## Allows the additional directories to be empty
      # additional-dir-optional: true
      aws-account-id: <ACCOUNT_ID>
      aws-role: <ROLE_NAME>
      enable-infracost: true
      enable-private-access: true
