---
name: Workflow Validation
on:
  push:
    branches:
      - main
    paths:
      - ".github/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/**"

permissions:
  contents: read

jobs:
  validate-workflows:
    uses: appvia/appvia-cicd-workflows/.github/workflows/github-workflow-validation.yml@313f07f46b44c4f3c82e878d71dc3182a0ce3c3d # main
    name: Validate GitHub Workflows
